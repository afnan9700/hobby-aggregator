services:

  postgres:
    image: postgres:17-alpine
    container_name: hobbyaggregator-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hobbyuser} -d ${POSTGRES_DB:-hobbyaggregator}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: apps/backend-springboot
      dockerfile: Dockerfile
    container_name: hobbyaggregator-backend
    restart: unless-stopped
    ports:
      - "8082:8082"
    env_file:
      - apps/backend-springboot/.env
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data: