server:
  port: 8082

spring:
  application:
    name: hobby-aggregator-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hobbyaggregator}
    username: ${SPRING_DATASOURCE_USERNAME:hobbyuser}
    password: ${SPRING_DATASOURCE_PASSWORD:hobbysecret}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
